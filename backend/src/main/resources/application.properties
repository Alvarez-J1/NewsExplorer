# Server
server.port=${PORT:3001}

# DataSource – set these via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/newsexplorer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS – origin of the React dev server
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
